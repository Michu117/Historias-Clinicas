<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .header { background: #003f87; color: white; padding: 24px 32px; }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 4px 0 0; opacity: 0.85; font-size: 14px; }
    .body { padding: 32px; }
    .badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-creacion { background: #d7e2ff; color: #003f87; }
    .badge-cancelacion { background: #ffdad6; color: #ba1a1a; }
    .badge-reagendamiento { background: #86f2e4; color: #006a61; }
    .badge-derivacion { background: #d7e2ff; color: #003f87; }
    .badge-confirmacion { background: #d7e2ff; color: #003f87; }
    .badge-actualizacion_historia { background: #fff3e0; color: #e65100; }
    .message { font-size: 16px; line-height: 1.6; color: #1a1a2e; margin: 16px 0; }
    .footer { border-top: 1px solid #e0e0e0; padding: 16px 32px; font-size: 12px; color: #666; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>MediCampus</h1>
      <p>Sistema de Bienestar Universitario - UNL</p>
    </div>
    <div class="body">
      <span class="badge badge-{{ tipo }}">{{ tipo_label }}</span>
      <div class="message">{{ mensaje }}</div>
      {% if detalles %}
      <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 16px 0;">
      <p style="font-size: 13px; color: #666;">{{ detalles }}</p>
      {% endif %}
    </div>
    <div class="footer">
      Universidad Nacional de Loja &copy; {% now "Y" %}<br>
      Este es un mensaje autom&aacute;tico, por favor no responder.
    </div>
  </div>
</body>
</html>
